<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h1>Django URL Shortener</h1>

    <form id="shorten-form">
        <input type="text" id="url-input" placeholder="Enter long URL" style="width: 300px; padding: 8px;">
        <button type="submit" style="padding: 8px 15px;">Shorten</button>
    </form>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        const form = document.getElementById('shorten-form');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const url = document.getElementById('url-input').value;

            const response = await fetch('/shorten', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ original_url: url })
            });

            const data = await response.json();

            if (data.short_code) {
                resultDiv.innerHTML = `
                    <p>Short URL:</p>
                    <a href="/shorten/${data.short_code}" target="_blank">
                        http://localhost:8000/shorten/${data.short_code}
                    </a>
                `;
            } else {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error || 'Invalid URL'}</p>`;
            }
        });
    </script>
</body>
</html>
